version: 0.5.0
updated_at: 2026-07-22

routing_rules:
  - 先识别用户最终需要的是分析、策略、执行内容还是完整成果。
  - 用户明确要求固定报告或方案时，优先路由到成果节点，由成果节点调用业务能力。
  - 用户只要求一个专业模块时，路由到业务节点，不强制生成完整报告。
  - 涉及项目事实时先建立project-context；事实不足时列缺口，不用默认项目代替真实结论。
  - 涉及财务、价格、合规和对外承诺时必须加载对应基础节点。

ambiguity_rules:
  customer:
    single_customer_analysis: sales-officer
    customer_pool_or_reservoir_analysis: business-analyze-customer-reservoir
  sales_talk:
    direct_objection_response: saletricks
    roleplay_or_assessment: sales-talk-coach
    full_project_pitch_manual: deliverable-sales-pitch-manual
  management:
    recurring_weekly_or_monthly_review: deliverable-operating-review
    single_decision_request: deliverable-management-decision-brief
    cross_level_coordination: marketing-liaison

routes:
  - id: ROUTE-000
    intent: 新项目营销定位和产品建议
    triggers: [项目定位报告, 新项目定位, 产品定位, 户型配比建议]
    primary_node: deliverable-project-positioning-report

  - id: ROUTE-001
