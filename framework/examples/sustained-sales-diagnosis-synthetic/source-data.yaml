root_cause_chains:
  - id: RC-01
    statement: 竞品低总价与完整展示入市，本案价值表达和展示未同步升级，导致项目到访份额与复访下降。
    confidence: high
    contribution: primary
  - id: RC-02
    statement: 团队缩编和经理更换造成盘客、跟进及渠道验收中断，将持销来访成交率由接近10%拉低至约6%。
    confidence: high
    contribution: primary
  - id: RC-03
    statement: 165㎡供应占已推库存39.5%，但总价超预算且无样板间，形成结构性库存并拉低整体流速。
    confidence: high
    contribution: primary
  - id: AMP-01
    statement: 市场成交下降12%、竞品高佣和客户观望放大了三条主因果链，但不足以单独解释项目到访下降50%。
    confidence: medium
    contribution: amplifier

recommended_plan:
  two_week_actions:
    - {id: ACT-01, root_cause: RC-02, action: 恢复每日盘客和48小时跟进稽核, target: 跟进及时率95%、CRM完整率98%}
    - {id: ACT-02, root_cause: RC-01, action: 将传播从智慧奢居切换为实景兑现、空间和总价价值, target: 复访预约率提升至30%}
    - {id: ACT-03, root_cause: RC-03, action: 完成165㎡临时实体展示和一房一客复盘, target: 165㎡有效客户40组}
  four_to_eight_week_actions:
    - {id: ACT-04, root_cause: RC-01, action: 更新展示动线并对渠道按有效客户而非带看量验收, target: 8周到访600组}
    - {id: ACT-05, root_cause: RC-03, action: 为165㎡提供可选封窗或家电权益包并折算成本, target: 8周成交15套}
    - {id: ACT-06, root_cause: RC-01, action: 8月加推6号楼，115㎡保流速、135㎡立标杆, target: 加推去化30套}
  price_trigger:
    condition: 完成四周执行和展示修复后，持销来访成交仍低于8%，且135/165㎡未成交客户中超过50%明确因净价差距放弃
    action: 启动房号级结构性调价审批，不进行全盘普降

