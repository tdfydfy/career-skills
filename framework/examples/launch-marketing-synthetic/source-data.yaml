review_rules:
  - 168㎡A+B客户少于目标房源1.2倍时，不增加供应并逐客复盘付款与决策条件
  - 两周新媒体单位有效客户成本高于计划30%时，停止放量并更换内容或人群包
  - 一级竞品提前取证或价格低于本案同面积总价5%时，48小时内重做客户落位和情景测算
  - 展示延期超过7天时，启动替代展示和远程讲解，不沿用原转化假设

