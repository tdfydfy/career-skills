additional_project_facts:
  positioning: 东湾低密实景改善住区
  verified_value_evidence:
    - 容积率1.8，4栋17F小高层与4栋11F洋房
    - 538个车位，车位比1:1.20
    - 城市展厅、售楼处、示范区及125/132/168㎡样板间已经开放
    - 小高层精装成本2200元/㎡，洋房精装成本2600元/㎡
    - 首开覆盖105/125㎡小高层、132/168㎡洋房四个面积段
