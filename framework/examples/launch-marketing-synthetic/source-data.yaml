market_strategy_findings:
  city_inventory_months: 10.9
  district_inventory_months: 9.0
  opportunity: 近三个月成交放量，7月具备首开窗口
  threat: 供应同步增加，一级竞品东湾序预计2026年9月入市
  price_positions:
    105_125: 与东岸云府同价格带竞争，以总价和实景降低决策门槛
    132: 与澄庐壹号同总价竞争，以洋房属性和完整展示争夺改善客户
    168: 申请价位于片区高位，以标杆作用为主，不承担过高去化

customer_strategy_findings:
  subscribed_unique: 184
  strong_intent_ab: 150
  first_choice: {105㎡小高层: 45, 125㎡小高层: 42, 132㎡洋房: 53, 168㎡洋房: 44}
  resistance_counts:
    总价与付款安排: 62
    期房兑现与展示: 43
    通勤及生活配套: 31
    决策人未统一: 29
    等待竞品或市场变化: 19
  conclusion: 认筹总量支持集中首开，但168㎡一房一客承接和决策人到场仍是主要风险

core_conflicts:
  - 公司要求首开不低于3.30亿元并保持利润，但新增供应增加，首开窗口只有约六周
  - 项目申请价高于城市均价，必须用实景、产品和总价证据替代概念性溢价
  - 总认筹充足但168㎡认筹比仅1.0，不能用平均客储掩盖户型结构风险

strategy_choice:
  proposition: 抢先竞争窗口，以实景兑现建立改善价值，G1与Y1走量、Y3立标，分层客储并集中首开
  launch_mode: 集中首开
  opening_scope: G1、Y1、Y3，共156套
  target_units: 108
  target_contract_yuan: 337487500
  not_doing:
    - 不扩大168㎡首开供应
    - 不以Y3降价换取全盘表面去化率
    - 不做不能进入客户漏斗的泛流量大型活动
    - 不提前承诺未经批准的教育、投资和商业运营内容

